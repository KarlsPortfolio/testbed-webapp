name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main  # Only triggers when pull-request is officially merged into main
    paths:
      - 'bookstore-app/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Creates a sterile workspace and flattens the asset tree
      - name: Prepare Flat Static Assets
        run: |
          mkdir public-site
          cp -r bookstore-app/* public-site/

      # Publishes the flat contents directly to the hosting root
      - name: Deploy Subfolder to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public-site
          branch: gh-pages
          clean: true # Forces the action to wipe out any ghost cache on the gh-pages branch