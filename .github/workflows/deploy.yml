name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main  # Only triggers when code is merged into main
    paths:
      - 'bookstore-app/**'

# 💡 CRITICAL: Grant the explicit system tokens required for native hosting
permissions:
  contents: read
  pages: write      # Gives GitHub permission to update your hosting space
  id-token: write   # Gives GitHub permission to securely authenticate the deployment

# Prevents multiple deployments from overlapping and crashing
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      # Step 1: Tell GitHub to isolate your subfolder as the static asset source
      - name: Upload Static Assets Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'bookstore-app' # 🎯 Points directly inside your directory wrapper

      # Step 2: Stream the assets directly to the hosting engine (No branch required!)
      - name: Deploy to GitHub Pages Natively
        uses: actions/deploy-pages@v4